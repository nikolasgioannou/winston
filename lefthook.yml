pre-commit:
  jobs:
    - name: format
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      run: bunx eslint --max-warnings 0 {staged_files}
      glob: "*.ts"
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
