pre-commit:
  jobs:
    # Auto-format what's being committed, then run exactly the checks CI runs.
    - name: format
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: check
      run: bun run check

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
