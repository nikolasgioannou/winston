name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  device-protocol:
    name: Swift device protocol
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Swift protocol fixtures
        run: swift run --package-path packages/device-protocol ProtocolFixtures packages/device-protocol/fixtures/messages.json

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned runtimes
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          cache: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check commit messages
        run: bun run check:commits

      - name: Install project-local test browser
        run: bun run test:browser:install

      - name: Run the local quality gate
        run: bun run check

      - name: Build applications
        run: bun run build

  deploy:
    name: Deploy production
    needs: [quality, device-protocol]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'nikolasgioannou/winston'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://winston-628.fly.dev
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.102"

      - name: Deploy verified source and run release migrations
        run: flyctl deploy --remote-only --depot=true --ha=false --image-label "$IMAGE_LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify production readiness
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 https://winston-628.fly.dev/health/ready

  deploy-workspaces:
    name: Deploy cloud workspaces
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'nikolasgioannou/winston'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-workspace-deploy
      cancel-in-progress: false
    env:
      WORKSPACE_APP: winston-628-workspace
      WORKSPACE_MACHINE_IDS: ${{ vars.WORKSPACE_MACHINE_IDS }}
      IMAGE_LABEL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned runtimes
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          cache: false

      - name: Install pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.102"

      - name: Build and publish the verified workspace image
        run: flyctl deploy --config apps/workspace/fly.toml --dockerfile apps/workspace/Dockerfile --build-only --push --remote-only --depot=true --image-label "$IMAGE_LABEL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKSPACE_API_TOKEN }}

      - name: Update selected workspaces and verify persistent runtime health
        run: node scripts/deploy-workspaces.mjs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKSPACE_API_TOKEN }}
          WORKSPACE_IMAGE: registry.fly.io/winston-628-workspace:${{ env.IMAGE_LABEL }}
