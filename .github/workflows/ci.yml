name: CI

# Every push to main is checked (and builds the VM image when image/
# changed). Deploying is by hand: Actions → CI → Run workflow (or
# `gh workflow run ci.yml`), which checks, builds the service images and
# deploys that commit (docs/runbooks/deploys.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, for the database tests.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: winston
          POSTGRES_PASSWORD: winston
          POSTGRES_DB: winston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winston -d winston"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://winston:winston@127.0.0.1:5432/winston_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the exact Bun and Node versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # The same checks the pre-commit hook runs.
      - run: bun run check

  # The images for this commit, tagged with its SHA, on native ARM64 runners
  # (free for public repositories; the services run on Graviton). Each image
  # keeps its own layer cache in GitHub's cache. Tags are immutable, so an
  # image that's already pushed (a re-run) is skipped.
  images:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [api, agents, gateway, web, ops]
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY: 766577085959.dkr.ecr.us-east-1.amazonaws.com/winston/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::766577085959:role/winston-github-deploy
          aws-region: us-east-1
      - id: pushed
        run: |
          if aws ecr describe-images --repository-name "winston/${{ matrix.image }}" --image-ids "imageTag=${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pushed.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.pushed.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.pushed.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ contains(fromJSON('["web","ops"]'), matrix.image) && matrix.image || 'service' }}.Dockerfile
          build-args: SERVICE=${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The VM image, when anything baked into it changed (docs/design.md §18).
  # It's recorded in /winston/vm-ami, and agents moves each VM onto it in its
  # user's quiet hours, so image changes ship like everything else.
  ami:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ami
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The VM binaries' version counts commits on main.
          fetch-depth: 0
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push whose previous commit isn't known (the first, or a force
          # push) builds anyway.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^image/'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.image == 'true'
        uses: jdx/mise-action@v4
      - if: steps.changed.outputs.image == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changed.outputs.image == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::766577085959:role/winston-github-ami
          aws-region: us-east-1
      - if: steps.changed.outputs.image == 'true'
        run: bun run image:build:ami

  # Production, after the checks pass and the images are pushed
  # (docs/runbooks/deploys.md). GitHub's OIDC token is exchanged for the
  # deploy role (infra/src/ci.ts); no AWS keys are stored in GitHub. Only a
  # run started by hand gets here; a second waits for the running deploy
  # rather than interleaving with it.
  deploy:
    needs: images
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The VM binaries' version counts commits on main.
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::766577085959:role/winston-github-deploy
          aws-region: us-east-1
          # cdk deploy and the rollouts can outlast the default hour.
          role-duration-seconds: 3600
      - run: bun run deploy
