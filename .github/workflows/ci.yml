name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, for the database tests.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: winston
          POSTGRES_PASSWORD: winston
          POSTGRES_DB: winston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winston -d winston"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://winston:winston@127.0.0.1:5432/winston_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the exact Bun and Node versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # The same checks the pre-commit hook runs.
      - run: bun run check
