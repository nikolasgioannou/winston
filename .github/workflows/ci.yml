name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, for the database tests.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: winston
          POSTGRES_PASSWORD: winston
          POSTGRES_DB: winston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U winston -d winston"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://winston:winston@127.0.0.1:5432/winston_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the exact Bun and Node versions pinned in mise.toml.
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      # The same checks the pre-commit hook runs.
      - run: bun run check

  # Production deploys, after the checks pass (docs/design.md §8b). GitHub's
  # OIDC token is exchanged for the deploy role (infra/src/ci.ts); no AWS keys
  # are stored in GitHub.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::766577085959:role/winston-github-deploy
          aws-region: us-east-1
      - run: aws sts get-caller-identity
