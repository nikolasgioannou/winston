name: AMI

# Builds and registers the production VM AMI (docs/design.md §18), then
# records it in /winston/vm-ami. CI does this whenever image/ changes; this
# workflow is for a rebuild by hand (say, for the base image's updates).
# Agents moves existing VMs onto it in their users' quiet hours.
on:
  workflow_dispatch:

permissions:
  contents: read
  # GitHub's OIDC token, exchanged for the AMI role (infra/src/ci.ts).
  id-token: write

concurrency:
  group: ami
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::766577085959:role/winston-github-ami
          aws-region: us-east-1
      - run: bun run image:build:ami
