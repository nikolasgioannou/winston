name: winston

services:
  postgres:
    # Matches the major version on RDS in production.
    image: postgres:18.6
    environment:
      # Local-only credentials; this database is never reachable from outside the machine.
      POSTGRES_USER: winston
      POSTGRES_PASSWORD: winston
      POSTGRES_DB: winston
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winston -d winston"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Sends Google's sign-in callbacks on to a worktree's site (docs/local-dev.md,
  # Worktrees). Shared by every checkout; bun dev starts it in worktrees.
  oauth-relay:
    build:
      context: .
      dockerfile: docker/oauth-relay.Dockerfile
    image: winston-oauth-relay:local
    # Built here, never pulled; rebuilding is cached and picks up changes.
    pull_policy: build
    # Bun isn't PID 1, so docker stop's SIGTERM ends it straight away.
    init: true
    ports:
      - "127.0.0.1:3003:3003"

volumes:
  postgres:
