<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Upload frame</title>
  </head>
  <body style="margin: 0">
    <input type="file" id="f" />
    <script>
      const input = document.getElementById("f");
      input.onchange = () =>
        parent.postMessage(
          [...input.files].map((f) => f.name).join(", "),
          "*",
        );
    </script>
  </body>
</html>
