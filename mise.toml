[tools]
bun = "1.4.2"
node = "24.21.0"
cloudflared = "2026.9.3"
# The ticket tracker (.moth/), from its GitHub releases. After changing the
# version, run `moth skill install --agent claude` to update its skill to match.
"github:nikolasgioannou/moth" = "0.6.0"
# Builds the VM image (image/).
packer = "1.16.1"
# Reaches the winston-prod account through IAM Identity Center (docs/runbooks/aws-access.md).
aws-cli = "2.37.7"
# Manages the GCP footprint, Gmail push (infra/gcp; docs/runbooks/gcp-terraform.md).
terraform = "1.16.4"
